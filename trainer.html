<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>TraumaSim · Ausbilderansicht</title>
  <link rel="stylesheet" href="style.css">
</head>
<body><main>
  <section class="panel">
    <div class="muted">TRAUMASIM · AUSBILDER</div>
    <h1>Ausbilderansicht</h1>
    <a href="index.html">Patientenbibliothek</a>
    <p id="message" role="status">Bitte mit einem freigegebenen Ausbilderkonto anmelden.</p>
    <form id="login">
      <label>E-Mail <input id="email" type="email" autocomplete="username" required></label>
      <label>Passwort <input id="password" type="password" autocomplete="current-password" required></label>
      <button>Anmelden</button>
      <button id="register" type="submit">Ausbilderkonto einrichten</button>
    </form>
    <button id="logout" hidden>Abmelden</button>
  </section>

  <div id="workspace" hidden>
    <section class="panel">
      <h2>Übungen</h2>
      <label>Aktive Übung <select id="exercise"></select></label>
      <form id="create">
        <label>Titel für neue Übung <input id="exerciseTitle" maxlength="120" required></label>
        <button>Übung anlegen</button>
      </form>
    </section>
    <section id="live" class="panel" hidden>
      <h2>Geräteübergreifender Verlauf</h2>
      <p id="expiry" class="muted small"></p>
      <label>Patient auswählen <select id="choose"></select></label>
      <p id="patientStatus" aria-live="off"></p>
      <button id="pausePatient" data-action="pause">Patient pausieren</button>
      <button id="resumePatient" data-action="resume">Patient fortsetzen</button>
      <button id="resetPatient" data-action="reset">Patient zurücksetzen</button>
      <button id="resetAll" data-action="reset_all">Ganze Übung zurücksetzen</button>
      <p class="muted small">Nach dem Zurücksetzen wartet der Patient auf einen neuen Aufruf oder auf „Patient starten“.</p>
      <p><label>Patientenlink <input id="patientLink" readonly></label>
      <button id="copyLink">Patientenlink kopieren</button></p>
      <p><label>Zugangscode für vorhandenen QR-Code <input id="patientCode" readonly></label>
      <button id="copyCode">Zugangscode kopieren</button></p>
    </section>
    <section id="preview" class="panel" hidden>
      <h2>Ausbildervorschau</h2>
      <p id="secret"></p>
      <label>Übungsminute prüfen <input id="seek" type="range" min="0" max="25" value="0" step="1"></label>
      <div class="clock" id="clock">00:00</div>
      <button id="play">▶ Vorschau starten</button>
      <button id="pause">⏸ Vorschau pausieren</button>
      <button id="reset">↺ Vorschau zurücksetzen</button>
      <label>Vorschaugeschwindigkeit <select id="speed">
        <option value="1">1×</option><option value="5">5×</option><option value="30">30×</option><option value="60">60×</option>
      </select></label>
      <div id="triage" class="triage yellow"></div>
      <div class="grid" id="vitals"></div>
    </section>
  </div>
</main>
<script src="patients.js"></script>
<script src="supabase-config.js"></script>
<script src="sync.js"></script>
<script src="trainer.js"></script>
</body>
</html>
